<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Book icon -->
  <g transform="translate(100, 85)">
    <path d="M-40,-20 L-40,20 L0,30 L40,20 L40,-20 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <line x1="0" y1="-20" x2="0" y2="30" stroke="url(#gold)" stroke-width="2"/>
    <line x1="-30" y1="-10" x2="-10" y2="-10" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-2" x2="-10" y2="-2" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="6" x2="-10" y2="6" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="30" y2="-10" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-2" x2="30" y2="-2" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="6" x2="30" y2="6" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Star decorations -->
  <polygon points="100,55 103,64 113,64 105,70 108,79 100,73 92,79 95,70 87,64 97,64" fill="url(#gold)" opacity="0.8"/>
  
  <!-- Text -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#gold)">100</text>
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">READERS</text>
</svg>
