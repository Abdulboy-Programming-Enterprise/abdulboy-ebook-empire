<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#A8A8A8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="url(#silver)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Star/Review icon -->
  <g transform="translate(100, 80)">
    <!-- Star -->
    <polygon points="0,-35 8,-12 33,-12 13,5 20,28 0,15 -20,28 -13,5 -33,-12 -8,-12" fill="none" stroke="url(#silver)" stroke-width="2.5"/>
    <!-- Pen -->
    <line x1="25" y1="25" x2="45" y2="35" stroke="url(#silver)" stroke-width="2"/>
    <line x1="45" y1="35" x2="48" y2="30" stroke="url(#silver)" stroke-width="2"/>
  </g>
  
  <!-- Sparkle decorations -->
  <circle cx="65" cy="65" r="3" fill="url(#silver)" opacity="0.6"/>
  <circle cx="135" cy="65" r="3" fill="url(#silver)" opacity="0.6"/>
  <circle cx="80" cy="50" r="2" fill="url(#silver)" opacity="0.4"/>
  <circle cx="120" cy="50" r="2" fill="url(#silver)" opacity="0.4"/>
  
  <!-- Text -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#silver)">50</text>
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">REVIEWS</text>
</svg>
