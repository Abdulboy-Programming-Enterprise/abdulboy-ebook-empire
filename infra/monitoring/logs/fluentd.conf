# =============================================================================
# FLUENTD CONFIGURATION - Log Aggregation
# =============================================================================
# Collects logs from all services and forwards to Elasticsearch/Loki
# =============================================================================

<source>
  @type tail
  @id in_tail_container_logs
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.log.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type json
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type forward
  @id in_forward
  port 24224
</source>

<source>
  @type http
  @id in_http
  port 9880
</source>

# =============================================================================
# Filter: Add Kubernetes metadata
# =============================================================================
<filter kubernetes.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  api_url https://kubernetes.default.svc
  cache_size 1000
  cache_ttl 300
</filter>

# =============================================================================
# Filter: Parse API logs
# =============================================================================
<filter kubernetes.var.log.containers.abduiboy-api**>
  @type parser
  key_name log
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
  </parse>
  reserve_data true
</filter>

# =============================================================================
# Filter: Parse Nginx access logs
# =============================================================================
<filter kubernetes.var.log.containers.abduiboy-web**>
  @type parser
  key_name log
  <parse>
    @type regexp
    expression /^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]+)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?/
    time_key time
    time_format %d/%b/%Y:%H:%M:%S %z
  </parse>
  key_name log
  reserve_data true
</filter>

# =============================================================================
# Filter: Parse PostgreSQL logs
# =============================================================================
<filter kubernetes.var.log.containers.abduiboy-postgres**>
  @type parser
  key_name log
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+)\[(?<pid>\d+)\]\s+(?<level>\w+):\s+(?<message>.*)$/
  </parse>
</filter>

# =============================================================================
# Multi-output: Send to both Elasticsearch and Loki
# =============================================================================
<match **>
  @type copy
  <store>
    @type elasticsearch
    @id out_es
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix abdulboy-logs
    include_timestamp true
    type_name fluentd
    flush_interval 5s
    reload_connections false
    reconnect_on_error true
    reload_on_failure true
    <buffer>
      @type memory
      flush_thread_count 4
      flush_interval 5s
      chunk_limit_size 2m
      queue_limit_length 32
      overflow_action block
    </buffer>
  </store>
  <store>
    @type loki
    @id out_loki
    url http://loki:3100
    username ${LOKI_USERNAME}
    password ${LOKI_PASSWORD}
    <label>
      container_name
      namespace
      pod_name
      app
      tier
    </label>
    <buffer>
      @type memory
      flush_interval 5s
    </buffer>
  </store>
</match>

# =============================================================================
# Error log output
# =============================================================================
<match fluentd.**>
  @type stdout
</match>
