; =============================================================================
; SUPERVISORD CONFIGURATION - Process Management
; =============================================================================
; Manages multiple processes inside the container
; =============================================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
user=root

; =============================================================================
; Web Interface (optional, for debugging)
; =============================================================================
[inet_http_server]
port=127.0.0.1:9001

; =============================================================================
; API Server (Gunicorn)
; =============================================================================
[program:api]
command=gunicorn --config /app/gunicorn.conf.py app.app:app
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/app/logs/api_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=PYTHONPATH="/app",APP_ENV="production"

; =============================================================================
; Celery Worker
; =============================================================================
[program:celery-worker]
command=celery -A app.tasks worker --loglevel=info --concurrency=4 --queues=default,high,low
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; =============================================================================
; Celery Beat (Scheduled Tasks)
; =============================================================================
[program:celery-beat]
command=celery -A app.tasks beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/celery_beat.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; =============================================================================
; Flower (Celery Monitoring)
; =============================================================================
[program:flower]
command=celery -A app.tasks flower --port=5555 --basic_auth=admin:${FLOWER_PASSWORD}
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/flower.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; =============================================================================
; Health Check Endpoint
; =============================================================================
[program:healthcheck]
command=python -m http.server 8080 --directory /app/static
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/null

; =============================================================================
; Log Rotation
; =============================================================================
[eventlistener:logrotator]
command=/usr/sbin/logrotate /etc/logrotate.conf
autostart=true
autorestart=true
events=PROCESS_LOG
buffer_size=10
