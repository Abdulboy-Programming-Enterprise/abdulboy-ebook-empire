# =============================================================================
# KUBERNETES SECRETS - Abdulboy Ebook Empire
# =============================================================================
# WARNING: This file is for reference only.
# DO NOT commit actual secrets to version control!
# Use external secret management (Vault, AWS Secrets Manager, SealedSecrets)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: abdulboy-secrets
  namespace: abdulboy-ebook
type: Opaque
stringData:
  # Database
  database_url: "postgresql://abdulboy_admin:${DB_PASSWORD}@postgres:5432/abdulboy_ebook_empire"
  
  # Redis
  redis_url: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  
  # MongoDB
  mongodb_uri: "mongodb://abdulboy_admin:${MONGODB_PASSWORD}@mongodb:27017/abdulboy_analytics"
  
  # JWT Secrets
  jwt_secret_key: "${JWT_SECRET_KEY}"
  jwt_refresh_secret_key: "${JWT_REFRESH_SECRET_KEY}"
  
  # Stripe
  stripe_public_key: "${STRIPE_PUBLIC_KEY}"
  stripe_secret_key: "${STRIPE_SECRET_KEY}"
  stripe_webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
  
  # OPay
  opay_merchant_id: "${OPAY_MERCHANT_ID}"
  opay_public_key: "${OPAY_PUBLIC_KEY}"
  opay_secret_key: "${OPAY_SECRET_KEY}"
  opay_webhook_secret: "${OPAY_WEBHOOK_SECRET}"
  
  # PayPal
  paypal_client_id: "${PAYPAL_CLIENT_ID}"
  paypal_client_secret: "${PAYPAL_CLIENT_SECRET}"
  
  # AWS
  aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
  aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  aws_bucket_name: "${AWS_BUCKET_NAME}"
  
  # Email
  smtp_password: "${SMTP_PASSWORD}"
  sendgrid_api_key: "${SENDGRID_API_KEY}"
  
  # OpenAI
  openai_api_key: "${OPENAI_API_KEY}"
  
  # Sentry
  sentry_dsn: "${SENTRY_DSN}"
  
  # Admin
  admin_password_hash: "${ADMIN_PASSWORD_HASH}"
---
# TLS Secret (for HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: abdulboy-tls
  namespace: abdulboy-ebook
type: kubernetes.io/tls
stringData:
  tls.crt: |
    # Certificate will be generated by cert-manager
    # This is a placeholder
  tls.key: |
    # Private key will be generated by cert-manager
    # This is a placeholder
---
# Registry Pull Secret (for private container registry)
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: abdulboy-ebook
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "${GITHUB_USERNAME}",
          "password": "${GITHUB_TOKEN}",
          "auth": "${GITHUB_AUTH_BASE64}"
        }
      }
    }
