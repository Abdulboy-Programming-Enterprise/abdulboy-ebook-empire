# =============================================================================
# KUBERNETES INGRESS - Abdulboy Ebook Empire
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abdulboy-ingress
  namespace: abdulboy-ebook
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://abdulboy-ebook.com,https://www.abdulboy-ebook.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # SSL/TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    
    # Large file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    
    # Websocket support
    nginx.ingress.kubernetes.io/websocket-services: "abdulboy-api"
    
    # ModSecurity WAF
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecResponseBodyAccess On
    
    # Cache
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
spec:
  tls:
  - hosts:
    - abdulboy-ebook.com
    - www.abdulboy-ebook.com
    - api.abdulboy-ebook.com
    - admin.abdulboy-ebook.com
    secretName: abdulboy-tls
  rules:
  # Main website
  - host: abdulboy-ebook.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abdulboy-web
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: abdulboy-api
            port:
              number: 8000
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: abdulboy-web
            port:
              number: 80
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: abdulboy-web
            port:
              number: 80
      - path: /uploads
        pathType: Prefix
        backend:
          service:
            name: abdulboy-api
            port:
              number: 8000
  
  # WWW redirect
  - host: www.abdulboy-ebook.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abdulboy-web
            port:
              number: 80
  
  # API subdomain
  - host: api.abdulboy-ebook.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abdulboy-api
            port:
              number: 8000
  
  # Admin subdomain
  - host: admin.abdulboy-ebook.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: abdulboy-web
            port:
              number: 80
