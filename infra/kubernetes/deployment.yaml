# =============================================================================
# KUBERNETES DEPLOYMENTS - Abdulboy Ebook Empire
# =============================================================================
---
# API Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abdulboy-api
  namespace: abdulboy-ebook
  labels:
    app: abdulboy-api
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: abdulboy-api
  template:
    metadata:
      labels:
        app: abdulboy-api
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: ghcr.io/abdulboy/abdulboy-ebook-empire-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: redis_url
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: stripe_secret_key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        envFrom:
        - configMapRef:
            name: abdulboy-config
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:latest
        ports:
        - containerPort: 5775
          protocol: UDP
        - containerPort: 6831
          protocol: UDP
        - containerPort: 6832
          protocol: UDP
        - containerPort: 5778
        args:
        - --reporter.grpc.host-port=jaeger-collector:14250
---
# Worker Deployment (Celery)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abdulboy-worker
  namespace: abdulboy-ebook
  labels:
    app: abdulboy-worker
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: abdulboy-worker
  template:
    metadata:
      labels:
        app: abdulboy-worker
        tier: backend
    spec:
      containers:
      - name: worker
        image: ghcr.io/abdulboy/abdulboy-ebook-empire-api:latest
        command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: redis_url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - configMapRef:
            name: abdulboy-config
---
# Celery Beat Deployment (Scheduled Tasks)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abdulboy-beat
  namespace: abdulboy-ebook
  labels:
    app: abdulboy-beat
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abdulboy-beat
  template:
    metadata:
      labels:
        app: abdulboy-beat
        tier: backend
    spec:
      containers:
      - name: beat
        image: ghcr.io/abdulboy/abdulboy-ebook-empire-api:latest
        command: ["celery", "-A", "app.tasks", "beat", "--loglevel=info"]
        env:
        - name: APP_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: database_url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: abdulboy-secrets
              key: redis_url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: abdulboy-config
---
# Frontend Nginx Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abdulboy-web
  namespace: abdulboy-ebook
  labels:
    app: abdulboy-web
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: abdulboy-web
  template:
    metadata:
      labels:
        app: abdulboy-web
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: static-files
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: static-files
        persistentVolumeClaim:
          claimName: static-files-pvc
