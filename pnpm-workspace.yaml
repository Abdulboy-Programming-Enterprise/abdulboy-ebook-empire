# =============================================================================
# PNPM WORKSPACE CONFIGURATION - MONOREPO MANAGEMENT
# =============================================================================

packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

catalog:
  # Frontend Dependencies
  react: ^18.2.0
  react-dom: ^18.2.0
  vue: ^3.3.0
  vite: ^4.4.0
  webpack: ^5.88.0
  
  # Backend Dependencies (Python not in pnpm)
  # These are for documentation only - actual Python deps in requirements.txt
  
  # Shared Utilities
  lodash: ^4.17.21
  dayjs: ^1.11.0
  axios: ^1.4.0
  
  # Testing
  vitest: ^0.34.0
  jest: ^29.6.0
  playwright: ^1.37.0

onlyBuiltDependencies:
  - '@swc/core'
  - 'core-js'
  - 'esbuild'
  - 'sharp'

overrides:
  semver: ^7.5.4
  axios: ^1.5.0

supportedArchitectures:
  os:
    - 'win32'
    - 'linux'
    - 'darwin'
  cpu:
    - 'x64'
    - 'arm64'
