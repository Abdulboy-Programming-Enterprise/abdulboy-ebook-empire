<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Accounts - Admin</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-sidebar">
      <h3>📚 ABE Admin</h3>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/books-manager.html">Books</a>
        <a href="/admin/users-manager.html">Users</a>
        <a href="/admin/special-accounts.html">Special Users</a>
        <a href="/admin/admin-accounts.html" class="active">Admins</a>
      </nav>
    </div>
    <div class="admin-main">
      <h1>Admin Accounts</h1>
      <div class="create-form">
        <h3>Add New Admin</h3>
        <form id="create-admin-form">
          <input type="email" name="email" placeholder="Email address" required>
          <input type="text" name="full_name" placeholder="Full name" required>
          <button type="submit" class="btn btn-primary">Create Admin Account</button>
        </form>
      </div>
      <h3>Current Administrators</h3>
      <table class="admin-table" id="admin-users-table">
        <thead><tr><th>Email</th><th>Name</th><th>Created</th><th>Last Login</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('access_token');
    const currentUserEmail = '';
    
    async function loadAdmins() {
      try {
        const res = await fetch('/api/v1/admin/users?account_type=admin', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          const tbody = document.querySelector('#admin-users-table tbody');
          tbody.innerHTML = data.data.items.map(u => `
            <tr>
              <td>${escapeHtml(u.email)}</td>
              <td>${escapeHtml(u.full_name)}</td>
              <td>${new Date(u.created_at).toLocaleDateString()}</td>
              <td>${u.last_login_at ? new Date(u.last_login_at).toLocaleDateString() : 'Never'}</td>
              <td><button class="remove-admin" data-id="${u.id}" data-email="${u.email}">Remove Admin</button></td>
            </tr>
          `).join('');
          document.querySelectorAll('.remove-admin').forEach(btn => btn.addEventListener('click', () => removeAdmin(btn.dataset.id, btn.dataset.email)));
        }
      } catch(e) { console.error(e); }
    }
    
    async function createAdmin(email, fullName) {
      try {
        const res = await fetch('/api/v1/admin/users/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ email, full_name: fullName })
        });
        if (res.ok) { alert('Admin account created'); loadAdmins(); }
        else alert('Failed to create admin');
      } catch(e) { alert('Error creating admin'); }
    }
    
    async function removeAdmin(userId, email) {
      if (email === currentUserEmail) { alert('Cannot remove your own admin account'); return; }
      if (!confirm(`Remove admin privileges from ${email}?`)) return;
      try {
        const res = await fetch(`/api/v1/admin/users/${userId}/remove-admin`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) { alert('Admin privileges removed'); loadAdmins(); }
      } catch(e) { console.error(e); }
    }
    
    document.getElementById('create-admin-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      createAdmin(e.target.email.value, e.target.full_name.value);
      e.target.reset();
    });
    
    loadAdmins();
    function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  </script>
</body>
</html>
