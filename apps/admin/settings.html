<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin Dashboard</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-sidebar">
      <h3>📚 ABE Admin</h3>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/books-manager.html">Books</a>
        <a href="/admin/users-manager.html">Users</a>
        <a href="/admin/bookings-manager.html">Bookings</a>
        <a href="/admin/payments-view.html">Payments</a>
        <a href="/admin/analytics-view.html">Analytics</a>
        <a href="/admin/settings.html" class="active">Settings</a>
      </nav>
    </div>
    <div class="admin-main">
      <h1>System Settings</h1>
      <div class="settings-tabs">
        <button class="tab-btn active" data-tab="general">General</button>
        <button class="tab-btn" data-tab="payments">Payments</button>
        <button class="tab-btn" data-tab="email">Email</button>
        <button class="tab-btn" data-tab="security">Security</button>
      </div>
      
      <div id="general-tab" class="tab-content active">
        <form id="general-settings">
          <div class="form-group"><label>Site Name</label><input type="text" name="site_name" value="Abdulboy Ebook Empire"></div>
          <div class="form-group"><label>Site Description</label><textarea name="site_description">World-class ebook platform</textarea></div>
          <div class="form-group"><label>Contact Email</label><input type="email" name="contact_email" value="admin@abdulboy-ebook.com"></div>
          <div class="form-group"><label>Default Currency</label><select name="currency"><option>USD</option><option>NGN</option><option>EUR</option></select></div>
          <button type="submit" class="btn btn-primary">Save General Settings</button>
        </form>
      </div>
      
      <div id="payments-tab" class="tab-content">
        <form id="payments-settings">
          <h3>Stripe Configuration</h3>
          <div class="form-group"><label>Stripe Secret Key</label><input type="password" name="stripe_secret" placeholder="sk_..."></div>
          <div class="form-group"><label>Stripe Public Key</label><input type="text" name="stripe_public" placeholder="pk_..."></div>
          <div class="form-group"><label>Stripe Webhook Secret</label><input type="password" name="stripe_webhook"></div>
          <h3>OPay Configuration</h3>
          <div class="form-group"><label>OPay Merchant ID</label><input type="text" name="opay_merchant"></div>
          <div class="form-group"><label>OPay Secret Key</label><input type="password" name="opay_secret"></div>
          <div class="form-group"><label>Environment</label><select name="opay_env"><option>sandbox</option><option>production</option></select></div>
          <button type="submit" class="btn btn-primary">Save Payment Settings</button>
        </form>
      </div>
      
      <div id="email-tab" class="tab-content">
        <form id="email-settings">
          <div class="form-group"><label>SMTP Host</label><input type="text" name="smtp_host" value="smtp.gmail.com"></div>
          <div class="form-group"><label>SMTP Port</label><input type="number" name="smtp_port" value="587"></div>
          <div class="form-group"><label>SMTP User</label><input type="email" name="smtp_user"></div>
          <div class="form-group"><label>SMTP Password</label><input type="password" name="smtp_password"></div>
          <div class="form-group"><label>From Email</label><input type="email" name="from_email" value="noreply@abdulboy-ebook.com"></div>
          <button type="submit" class="btn btn-primary">Save Email Settings</button>
        </form>
      </div>
      
      <div id="security-tab" class="tab-content">
        <form id="security-settings">
          <div class="form-group"><label>Rate Limit (requests per minute)</label><input type="number" name="rate_limit" value="100"></div>
          <div class="form-group"><label>Session Timeout (minutes)</label><input type="number" name="session_timeout" value="30"></div>
          <div class="form-group"><label>Max Login Attempts</label><input type="number" name="max_login_attempts" value="5"></div>
          <div class="form-group"><label>Enable 2FA for Admins</label><input type="checkbox" name="enable_2fa"></div>
          <button type="submit" class="btn btn-primary">Save Security Settings</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
      });
    });
    
    async function saveSettings(formId, endpoint) {
      const form = document.getElementById(formId);
      if (!form) return;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const token = localStorage.getItem('access_token');
        try {
          const res = await fetch(`/api/v1/admin/settings/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(data) });
          if (res.ok) alert('Settings saved successfully'); else alert('Failed to save settings');
        } catch(e) { alert('Error saving settings'); }
      });
    }
    saveSettings('general-settings', 'general');
    saveSettings('payments-settings', 'payments');
    saveSettings('email-settings', 'email');
    saveSettings('security-settings', 'security');
  </script>
</body>
</html>
