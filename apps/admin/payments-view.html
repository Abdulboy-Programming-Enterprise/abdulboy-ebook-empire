<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments - Admin Dashboard</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-sidebar">
      <h3>📚 ABE Admin</h3>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/books-manager.html">Books</a>
        <a href="/admin/users-manager.html">Users</a>
        <a href="/admin/bookings-manager.html">Bookings</a>
        <a href="/admin/payments-view.html" class="active">Payments</a>
        <a href="/admin/analytics-view.html">Analytics</a>
        <a href="/admin/settings.html">Settings</a>
      </nav>
    </div>
    <div class="admin-main">
      <div class="admin-header">
        <h1>Payment Transactions</h1>
        <div class="filters">
          <select id="payment-status-filter">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
          <select id="payment-method-filter">
            <option value="">All Methods</option>
            <option value="stripe">Stripe</option>
            <option value="opay">OPay</option>
            <option value="paypal">PayPal</option>
          </select>
          <input type="text" id="payment-search" placeholder="Search by user or transaction ID">
        </div>
      </div>
      <table class="admin-table" id="payments-table">
        <thead>
          <tr><th>ID</th><th>User</th><th>Amount</th><th>Method</th><th>Type</th><th>Status</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pagination" id="payments-pagination"></div>
    </div>
  </div>
  <script>
    let currentPage = 1;
    const token = localStorage.getItem('access_token');
    
    async function loadPayments() {
      const status = document.getElementById('payment-status-filter')?.value;
      const method = document.getElementById('payment-method-filter')?.value;
      const search = document.getElementById('payment-search')?.value;
      
      try {
        const res = await fetch(`/api/v1/admin/payments?page=${currentPage}&limit=50&status=${status}&method=${method}&search=${search}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          renderPaymentsTable(data.data.items);
          renderPagination(data.data);
        }
      } catch(e) { console.error(e); }
    }
    
    function renderPaymentsTable(payments) {
      const tbody = document.querySelector('#payments-table tbody');
      if (!tbody) return;
      if (!payments?.length) { tbody.innerHTML = '<tr><td colspan="8">No payments found</td></tr>'; return; }
      
      tbody.innerHTML = payments.map(p => `
        <tr>
          <td>${p.id?.slice(0,8)}</td>
          <td>${escapeHtml(p.user_email || 'N/A')}</td>
          <td>$${p.amount?.toFixed(2)}</td>
          <td>${p.payment_method}</td>
          <td>${p.item_type}</td>
          <td><span class="status-badge status-${p.status}">${p.status}</span></td>
          <td>${new Date(p.created_at).toLocaleDateString()}</td>
          <td><button class="view-payment" data-id="${p.id}">View</button>${p.status === 'completed' ? `<button class="refund-payment" data-id="${p.id}">Refund</button>` : ''}</td>
        </tr>
      `).join('');
      
      document.querySelectorAll('.view-payment').forEach(btn => btn.addEventListener('click', () => viewPayment(btn.dataset.id)));
      document.querySelectorAll('.refund-payment').forEach(btn => btn.addEventListener('click', () => refundPayment(btn.dataset.id)));
    }
    
    function renderPagination(data) {
      const container = document.getElementById('payments-pagination');
      if (!container || data.total_pages <= 1) { if(container) container.innerHTML = ''; return; }
      let html = '';
      for(let i=1; i<=Math.min(data.total_pages, 10); i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      container.innerHTML = html;
      document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); loadPayments(); }));
    }
    
    async function viewPayment(id) { window.location.href = `/admin/payment-details.html?id=${id}`; }
    async function refundPayment(id) { if(confirm('Refund this payment?')) { await fetch(`/api/v1/admin/payments/${id}/refund`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); loadPayments(); } }
    
    document.getElementById('payment-status-filter')?.addEventListener('change', () => { currentPage = 1; loadPayments(); });
    document.getElementById('payment-method-filter')?.addEventListener('change', () => { currentPage = 1; loadPayments(); });
    document.getElementById('payment-search')?.addEventListener('input', () => { currentPage = 1; loadPayments(); });
    
    loadPayments();
    function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  </script>
</body>
</html>
