<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Accounts - Admin</title>
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="admin-container">
    <div class="admin-sidebar">
      <h3>📚 ABE Admin</h3>
      <nav>
        <a href="/admin/dashboard.html">Dashboard</a>
        <a href="/admin/books-manager.html">Books</a>
        <a href="/admin/users-manager.html">Users</a>
        <a href="/admin/special-accounts.html" class="active">Special Users</a>
        <a href="/admin/admin-accounts.html">Admins</a>
      </nav>
    </div>
    <div class="admin-main">
      <h1>Special User Accounts</h1>
      <p>Special users have free access to all books without subscription.</p>
      <div class="create-form">
        <h3>Create New Special User</h3>
        <form id="create-special-form">
          <input type="email" name="email" placeholder="Email address" required>
          <input type="text" name="full_name" placeholder="Full name" required>
          <button type="submit" class="btn btn-primary">Create Special User</button>
        </form>
      </div>
      <h3>Existing Special Users</h3>
      <table class="admin-table" id="special-users-table">
        <thead><tr><th>Email</th><th>Name</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    const token = localStorage.getItem('access_token');
    
    async function loadSpecialUsers() {
      try {
        const res = await fetch('/api/v1/admin/users?account_type=special', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          const tbody = document.querySelector('#special-users-table tbody');
          tbody.innerHTML = data.data.items.map(u => `
            <tr>
              <td>${escapeHtml(u.email)}</td>
              <td>${escapeHtml(u.full_name)}</td>
              <td>${new Date(u.created_at).toLocaleDateString()}</td>
              <td><button class="remove-special" data-id="${u.id}">Remove</button></td>
            </tr>
          `).join('');
          document.querySelectorAll('.remove-special').forEach(btn => btn.addEventListener('click', () => removeSpecial(btn.dataset.id)));
        }
      } catch(e) { console.error(e); }
    }
    
    async function createSpecialUser(email, fullName) {
      try {
        const res = await fetch('/api/v1/admin/users/special', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ email, full_name: fullName })
        });
        if (res.ok) { alert('Special user created'); loadSpecialUsers(); }
        else alert('Failed to create special user');
      } catch(e) { alert('Error creating user'); }
    }
    
    async function removeSpecial(userId) {
      if (!confirm('Remove special privileges from this user?')) return;
      try {
        const res = await fetch(`/api/v1/admin/users/${userId}/remove-special`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) { alert('Special privileges removed'); loadSpecialUsers(); }
      } catch(e) { console.error(e); }
    }
    
    document.getElementById('create-special-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = e.target.email.value;
      const fullName = e.target.full_name.value;
      createSpecialUser(email, fullName);
      e.target.reset();
    });
    
    loadSpecialUsers();
    function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
  </script>
</body>
</html>
