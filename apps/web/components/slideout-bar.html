<!-- ========================================================================= -->
<!-- SLIDEOUT BAR - Quick Access Panel from Right Side -->
<!-- ========================================================================= -->

<div class="slideout-panel" id="slideout-panel">
  <button class="slideout-trigger" id="slideout-trigger">
    <span>⚡</span>
    <span>Quick</span>
    <span>Access</span>
  </button>
  
  <div class="slideout-content" id="slideout-content">
    <div class="slideout-header">
      <h3>Quick Access</h3>
      <button class="slideout-close" id="slideout-close">×</button>
    </div>
    
    <div class="slideout-body">
      <div class="user-greeting" id="slideout-greeting">
        <img src="/images/default-avatar.png" alt="Avatar" class="greeting-avatar">
        <div>
          <div class="greeting-name">Welcome, Guest!</div>
          <div class="greeting-points">⭐ 0 points</div>
        </div>
      </div>
      
      <div class="quick-actions">
        <a href="/ebook-site.html" class="quick-action">📚 Browse Books</a>
        <a href="/subscription-plans.html" class="quick-action">⭐ Subscription</a>
        <a href="/custom-book-booking.html" class="quick-action">✍️ Custom Book</a>
        <a href="/user-dashboard.html#library" class="quick-action">📖 My Library</a>
        <button class="quick-action scroll-to-top">⬆️ Scroll to Top</button>
        <button class="quick-action scroll-to-bottom">⬇️ Scroll to Bottom</button>
      </div>
      
      <div class="reading-progress" id="reading-progress">
        <h4>Continue Reading</h4>
        <div class="progress-list"></div>
      </div>
      
      <div class="support-links">
        <a href="/contact.html">📧 Contact Support</a>
        <a href="/faq.html">❓ FAQ</a>
        <a href="/terms.html">📜 Terms</a>
      </div>
    </div>
  </div>
</div>

<style>
.slideout-panel {
  position: fixed;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  z-index: 1000;
}
.slideout-trigger {
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  border: none;
  border-radius: 30px 0 0 30px;
  padding: 1rem 0.5rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  color: white;
  font-size: 0.75rem;
  writing-mode: vertical-rl;
  text-orientation: mixed;
}
.slideout-content {
  position: fixed;
  top: 0;
  right: -380px;
  width: 360px;
  height: 100vh;
  background: var(--bg-primary);
  box-shadow: -5px 0 25px rgba(0,0,0,0.15);
  z-index: 1001;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}
.slideout-content.open {
  right: 0;
}
.slideout-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--border-color);
}
.slideout-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
}
.slideout-body {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
}
.user-greeting {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1rem;
  background: var(--bg-secondary);
  border-radius: 12px;
  margin-bottom: 1rem;
}
.greeting-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}
.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.quick-action {
  padding: 0.75rem;
  background: var(--bg-secondary);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text-primary);
  text-align: center;
  border: none;
  cursor: pointer;
  font-size: 0.875rem;
}
.quick-action:hover {
  background: var(--primary-color);
  color: white;
}
.reading-progress h4 {
  margin-bottom: 0.75rem;
}
.progress-item {
  padding: 0.75rem;
  background: var(--bg-secondary);
  border-radius: 8px;
  margin-bottom: 0.5rem;
}
.progress-title {
  font-weight: 500;
  margin-bottom: 0.25rem;
}
.progress-bar {
  height: 4px;
  background: var(--border-color);
  border-radius: 2px;
  overflow: hidden;
  margin: 0.5rem 0;
}
.progress-fill {
  height: 100%;
  background: var(--primary-color);
  width: 0%;
}
.support-links {
  display: flex;
  gap: 1rem;
  justify-content: center;
  padding-top: 1rem;
  border-top: 1px solid var(--border-color);
  margin-top: 1rem;
}
.support-links a {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-decoration: none;
}
@media (max-width: 768px) {
  .slideout-content {
    width: 100%;
    right: -100%;
  }
}
</style>

<script>
(function() {
  const trigger = document.getElementById('slideout-trigger');
  const content = document.getElementById('slideout-content');
  const closeBtn = document.getElementById('slideout-close');
  
  function openPanel() {
    content.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadUserData();
    loadReadingProgress();
  }
  
  function closePanel() {
    content.classList.remove('open');
    document.body.style.overflow = '';
  }
  
  trigger?.addEventListener('click', openPanel);
  closeBtn?.addEventListener('click', closePanel);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && content?.classList.contains('open')) closePanel();
  });
  
  async function loadUserData() {
    const token = localStorage.getItem('access_token');
    if (!token) return;
    try {
      const res = await fetch('/api/v1/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      if (data.success) {
        const greeting = document.getElementById('slideout-greeting');
        const nameSpan = greeting?.querySelector('.greeting-name');
        const pointsSpan = greeting?.querySelector('.greeting-points');
        if (nameSpan) nameSpan.textContent = data.data.full_name;
        if (pointsSpan) pointsSpan.textContent = `⭐ ${data.data.total_points || 0} points`;
      }
    } catch(e) { console.error(e); }
  }
  
  async function loadReadingProgress() {
    const token = localStorage.getItem('access_token');
    if (!token) return;
    try {
      const res = await fetch('/api/v1/users/reading-progress', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      if (data.success && data.data?.progress) {
        const container = document.querySelector('.progress-list');
        if (container && data.data.progress.length) {
          container.innerHTML = data.data.progress.map(book => `
            <div class="progress-item">
              <div class="progress-title">${escapeHtml(book.title)}</div>
              <div class="progress-bar"><div class="progress-fill" style="width: ${book.progress}%"></div></div>
              <button class="continue-reading" data-book-id="${book.id}" style="font-size:0.75rem; background:none; border:none; color:var(--primary-color); cursor:pointer;">Continue →</button>
            </div>
          `).join('');
          document.querySelectorAll('.continue-reading').forEach(btn => {
            btn.addEventListener('click', () => window.location.href = `/book-preview.html?id=${btn.dataset.bookId}`);
          });
        }
      }
    } catch(e) { console.error(e); }
  }
  
  document.querySelector('.scroll-to-top')?.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  document.querySelector('.scroll-to-bottom')?.addEventListener('click', () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
  
  function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
})();
</script>
