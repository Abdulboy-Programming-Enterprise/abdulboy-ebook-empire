<!-- ========================================================================= -->
<!-- NOTIFICATION TOAST - User Feedback Messages -->
<!-- ========================================================================= -->

<div class="toast-container" id="toast-container"></div>

<style>
.toast-container {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.toast {
  min-width: 280px;
  max-width: 400px;
  background: var(--bg-primary);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border-left: 4px solid;
  animation: slideInToast 0.3s ease;
}
@keyframes slideInToast {
  from { opacity: 0; transform: translateX(100%); }
  to { opacity: 1; transform: translateX(0); }
}
.toast-success { border-left-color: #10b981; }
.toast-error { border-left-color: #ef4444; }
.toast-warning { border-left-color: #f59e0b; }
.toast-info { border-left-color: #3b82f6; }
.toast-icon svg { width: 20px; height: 20px; }
.toast-content { flex: 1; }
.toast-title { font-weight: 600; font-size: 0.875rem; }
.toast-message { font-size: 0.813rem; color: var(--text-secondary); }
.toast-close { background: none; border: none; cursor: pointer; color: var(--text-muted); }
.progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--primary-color); animation: progressToast 5s linear forwards; }
@keyframes progressToast { from { width: 100%; } to { width: 0%; } }
@media (max-width: 768px) { .toast-container { top: auto; bottom: 1rem; left: 1rem; right: 1rem; } .toast { max-width: none; } }
</style>

<script>
(function() {
  const container = document.getElementById('toast-container');
  const icons = { success: '✓', error: '✗', warning: '⚠', info: 'ℹ' };
  const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
  
  window.showToast = function(message, type = 'info', duration = 5000) {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${icons[type] || icons.info}</div>
      <div class="toast-content"><div class="toast-title">${titles[type]}</div><div class="toast-message">${escapeHtml(message)}</div></div>
      <button class="toast-close">×</button>
      <div class="progress-bar" style="animation-duration: ${duration}ms"></div>
    `;
    container.appendChild(toast);
    
    const timeout = setTimeout(() => toast.remove(), duration);
    toast.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(timeout); toast.remove(); });
    toast.addEventListener('mouseenter', () => clearTimeout(timeout));
    toast.addEventListener('mouseleave', () => setTimeout(() => toast.remove(), 1000));
  };
  
  window.handleApiError = function(error, defaultMsg = 'Something went wrong') {
    console.error(error);
    showToast(error.response?.data?.message || defaultMsg, 'error');
  };
  
  function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
})();
</script>
