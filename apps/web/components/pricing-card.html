<!-- ========================================================================= -->
<!-- PRICING CARD COMPONENT - Subscription Plan Display -->
<!-- ========================================================================= -->

<div class="pricing-card" data-plan-id="">
  <div class="pricing-card-inner">
    <div class="pricing-header">
      <h3 class="plan-name"></h3>
      <p class="plan-description"></p>
    </div>
    <div class="pricing-price">
      <span class="currency">$</span>
      <span class="amount"></span>
      <span class="period">/month</span>
    </div>
    <ul class="pricing-features"></ul>
    <div class="pricing-action">
      <button class="subscribe-btn">Get Started</button>
    </div>
    <div class="popular-badge" style="display:none">Most Popular</div>
  </div>
</div>

<style>
.pricing-card {
  background: var(--bg-primary);
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-sm);
  height: 100%;
  position: relative;
}
.pricing-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
.pricing-card.popular { border: 2px solid var(--primary-color); transform: scale(1.02); }
.pricing-card-inner { padding: 2rem 1.5rem; text-align: center; }
.popular-badge { position: absolute; top: 1rem; right: -2rem; background: var(--primary-color); color: white; padding: 0.25rem 2rem; font-size: 0.75rem; font-weight: 600; transform: rotate(45deg); width: 120px; }
.plan-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
.plan-description { color: var(--text-secondary); font-size: 0.875rem; }
.pricing-price { margin: 1.5rem 0; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); }
.amount { font-size: 3rem; font-weight: 700; }
.period { font-size: 0.875rem; color: var(--text-secondary); }
.pricing-features { list-style: none; padding: 0; margin: 0 0 1.5rem; text-align: left; }
.pricing-features li { padding: 0.5rem 0; display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-secondary); }
.pricing-features li::before { content: "✓"; color: var(--primary-color); font-weight: bold; }
.subscribe-btn { width: 100%; padding: 0.875rem; background: var(--primary-color); color: white; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
.subscribe-btn:hover { background: var(--primary-dark); transform: scale(1.02); }
@media (max-width: 768px) { .pricing-card.popular { transform: scale(1); } }
</style>

<script>
window.renderPricingCard = function(plan, container) {
  const card = document.createElement('div');
  card.className = `pricing-card ${plan.is_popular ? 'popular' : ''}`;
  card.dataset.planId = plan.id;
  
  const featuresHtml = plan.features.map(f => `<li>${escapeHtml(f)}</li>`).join('');
  
  card.innerHTML = `
    <div class="pricing-card-inner">
      <div class="pricing-header">
        <h3 class="plan-name">${escapeHtml(plan.name)}</h3>
        <p class="plan-description">${escapeHtml(plan.description || '')}</p>
      </div>
      <div class="pricing-price">
        <span class="currency">${plan.currency === 'NGN' ? '₦' : '$'}</span>
        <span class="amount">${plan.price}</span>
        <span class="period">/${plan.interval || 'month'}</span>
      </div>
      <ul class="pricing-features">${featuresHtml}</ul>
      <div class="pricing-action">
        <button class="subscribe-btn" data-plan-id="${plan.id}">${plan.cta_text || 'Get Started'}</button>
      </div>
      ${plan.is_popular ? '<div class="popular-badge">Most Popular</div>' : ''}
    </div>
  `;
  
  card.querySelector('.subscribe-btn').addEventListener('click', () => {
    const token = localStorage.getItem('access_token');
    if (token) window.location.href = `/checkout.html?plan_id=${plan.id}`;
    else window.location.href = `/signup.html?redirect=/checkout.html?plan_id=${plan.id}`;
  });
  
  container.appendChild(card);
};
window.loadPricingPlans = async function(container) {
  try {
    const res = await fetch('/api/v1/subscriptions/plans');
    const data = await res.json();
    if (data.success) data.data.forEach(plan => window.renderPricingCard(plan, container));
  } catch(e) { console.error(e); container.innerHTML = '<p class="error">Failed to load plans</p>'; }
};
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
</script>
