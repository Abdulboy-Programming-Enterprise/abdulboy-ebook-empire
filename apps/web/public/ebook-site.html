<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Books - Abdulboy Ebook Empire</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/dark-mode.css">
  <link rel="stylesheet" href="/styles/responsive.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="container">
    <div class="page-header"><h1>All Books</h1><p>Discover thousands of ebooks from amazing authors</p></div>
    <div class="filters-bar"><input type="text" id="search-input" placeholder="Search by title or author..."><select id="category-filter"><option value="">All Categories</option><option value="fiction">Fiction</option><option value="non-fiction">Non-Fiction</option><option value="programming">Programming</option></select><select id="sort-filter"><option value="newest">Newest</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option></select></div>
    <div id="books-list-container" class="book-grid"></div>
    <div id="pagination-container"></div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/scripts/main.js"></script>
  <script src="/scripts/search-filter.js"></script>
</body>
</html>
