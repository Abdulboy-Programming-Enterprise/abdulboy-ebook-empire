<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Abdulboy Ebook Empire</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/dark-mode.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="auth-container">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p>Login to access your library and continue reading</p>
      <form id="login-form">
        <div class="form-group"><input type="email" id="email" placeholder="Email address" required></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password" required></div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <div class="auth-links"><a href="/forgot-password.html">Forgot password?</a><a href="/signup.html">Create account</a></div>
      </form>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/scripts/auth.js"></script>
</body>
</html>
