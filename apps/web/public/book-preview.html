<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Preview - Abdulboy Ebook Empire</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/dark-mode.css">
  <link rel="stylesheet" href="/styles/reader.css">
</head>
<body>
  <div id="header-placeholder"></div>
  
  <main id="reader-container" class="reader-container">
    <div class="reader-loading" id="reader-loading">Loading book...</div>
    
    <div class="reader-toolbar">
      <button id="prev-page" class="toolbar-btn">← Prev</button>
      <span>Page <span id="current-page">1</span> of <span id="total-pages">0</span></span>
      <button id="next-page" class="toolbar-btn">Next →</button>
      <button id="zoom-in" class="toolbar-btn">Zoom +</button>
      <button id="zoom-out" class="toolbar-btn">Zoom -</button>
      <button id="fullscreen-mode" class="toolbar-btn">Fullscreen</button>
    </div>
    
    <div id="pdf-viewer" class="pdf-viewer"></div>
  </main>
  
  <div id="footer-placeholder"></div>
  <script <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" 
    integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" 
    crossorigin="anonymous">
  </script>
  
  <script src="/scripts/book-reader.js"></script>
</body>
</html>
