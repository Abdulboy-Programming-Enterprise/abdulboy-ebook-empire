<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Abdulboy Ebook Empire</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/dark-mode.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="auth-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p>Join thousands of readers and start your journey</p>
      <form id="register-form">
        <div class="form-group"><input type="text" id="full_name" placeholder="Full name" required></div>
        <div class="form-group"><input type="email" id="email" placeholder="Email address" required></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password" required></div>
        <div class="form-group"><input type="password" id="confirm_password" placeholder="Confirm password" required></div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        <div class="auth-links"><a href="/login.html">Already have an account? Login</a></div>
      </form>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/scripts/auth.js"></script>
</body>
</html>
