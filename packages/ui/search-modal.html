<!-- ========================================================================= -->
<!-- SEARCH MODAL - Advanced Search Dialog -->
<!-- ========================================================================= -->

<div class="search-modal" id="search-modal" data-component="search-modal" style="display: none;">
  <div class="search-modal-overlay"></div>
  <div class="search-modal-container">
    <div class="search-modal-header">
      <h3 class="search-modal-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        Search Books
      </h3>
      <button class="search-modal-close">×</button>
    </div>
    
    <div class="search-modal-body">
      <div class="search-input-container">
        <input type="text" id="search-modal-input" placeholder="Search by title, author, ISBN, or keyword..." autocomplete="off">
        <button id="search-modal-submit" class="search-submit-btn">Search</button>
      </div>
      
      <div class="search-filters">
        <div class="filter-group">
          <label>Categories</label>
          <select id="search-category">
            <option value="">All Categories</option>
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
            <option value="programming">Programming</option>
            <option value="self-help">Self-Help</option>
            <option value="finance">Finance</option>
            <option value="technology">Technology</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Price Range</label>
          <div class="price-range">
            <input type="number" id="min-price" placeholder="Min" step="0.01">
            <span>-</span>
            <input type="number" id="max-price" placeholder="Max" step="0.01">
          </div>
        </div>
        
        <div class="filter-group">
          <label>Sort By</label>
          <select id="search-sort">
            <option value="relevance">Relevance</option>
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label>Availability</label>
          <select id="search-availability">
            <option value="">All Books</option>
            <option value="free">Free Books</option>
            <option value="paid">Paid Books</option>
            <option value="subscription">Subscription Only</option>
          </select>
        </div>
      </div>
      
      <!-- Search Results -->
      <div class="search-results" id="search-results">
        <div class="search-loading" style="display: none;">
          <div class="spinner"></div>
          <p>Searching...</p>
        </div>
        <div class="search-results-list" id="search-results-list"></div>
        <div class="search-pagination" id="search-pagination" style="display: none;"></div>
      </div>
      
      <!-- Recent Searches -->
      <div class="recent-searches" id="recent-searches">
        <div class="recent-header">
          <span>Recent Searches</span>
          <button id="clear-recent-searches">Clear</button>
        </div>
        <div class="recent-list" id="recent-list"></div>
      </div>
    </div>
  </div>
</div>

<style>
.search-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10000;
}

.search-modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
}

.search-modal-container {
  position: relative;
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  margin: 5vh auto;
  background: var(--bg-primary);
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.search-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.25rem;
  border-bottom: 1px solid var(--border-color);
}

.search-modal-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0;
  font-size: 1.25rem;
}

.search-modal-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.search-modal-close:hover {
  background: var(--bg-hover);
}

.search-modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.25rem;
}

.search-input-container {
  display: flex;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.search-input-container input {
  flex: 1;
  padding: 0.875rem 1rem;
  border: 2px solid var(--border-color);
  border-radius: 12px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 1rem;
}

.search-input-container input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.search-submit-btn {
  padding: 0.875rem 1.5rem;
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 500;
}

.search-filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding: 1rem;
  background: var(--bg-secondary);
  border-radius: 12px;
}

.filter-group label {
  display: block;
  font-size: 0.813rem;
  font-weight: 500;
  margin-bottom: 0.5rem;
  color: var(--text-secondary);
}

.filter-group select,
.filter-group input {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
  color: var(--text-primary);
}

.price-range {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.price-range input {
  width: 100px;
}

.search-results-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.search-result-item {
  display: flex;
  gap: 1rem;
  padding: 1rem;
  background: var(--bg-secondary);
  border-radius: 12px;
  transition: all 0.3s;
}

.search-result-item:hover {
  transform: translateX(5px);
  background: var(--bg-hover);
}

.result-cover {
  width: 80px;
  height: 110px;
  object-fit: cover;
  border-radius: 8px;
}

.result-info {
  flex: 1;
}

.result-title {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.result-author {
  color: var(--text-secondary);
  font-size: 0.875rem;
  margin-bottom: 0.5rem;
}

.result-price {
  font-weight: 600;
  color: var(--primary-color);
  margin-bottom: 0.5rem;
}

.result-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.result-btn {
  padding: 0.375rem 0.875rem;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.813rem;
}

.result-btn-primary {
  background: var(--primary-color);
  color: white;
}

.result-btn-secondary {
  background: var(--bg-primary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.search-pagination {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 1.5rem;
}

.pagination-btn {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border-color);
  background: var(--bg-primary);
  color: var(--text-primary);
  border-radius: 6px;
  cursor: pointer;
}

.pagination-btn.active {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
}

.recent-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.75rem;
}

.recent-header button {
  background: none;
  border: none;
  color: var(--primary-color);
  cursor: pointer;
  font-size: 0.813rem;
}

.recent-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.recent-item {
  padding: 0.375rem 0.875rem;
  background: var(--bg-secondary);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.875rem;
  transition: all 0.3s;
}

.recent-item:hover {
  background: var(--primary-color);
  color: white;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border-color);
  border-top-color: var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.search-loading {
  text-align: center;
  padding: 2rem;
}

@media (max-width: 768px) {
  .search-filters {
    grid-template-columns: 1fr;
  }
  
  .search-result-item {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  
  .result-cover {
    width: 120px;
    height: 160px;
  }
}
</style>

<script>
(function() {
  const modal = document.getElementById('search-modal');
  const overlay = document.querySelector('.search-modal-overlay');
  const closeBtn = document.querySelector('.search-modal-close');
  const searchInput = document.getElementById('search-modal-input');
  const searchBtn = document.getElementById('search-modal-submit');
  const resultsContainer = document.getElementById('search-results-list');
  const loadingIndicator = document.querySelector('.search-loading');
  const recentContainer = document.getElementById('recent-list');
  const clearRecentBtn = document.getElementById('clear-recent-searches');
  
  let currentPage = 1;
  let currentQuery = '';
  
  // Load recent searches from localStorage
  function loadRecentSearches() {
    const searches = JSON.parse(localStorage.getItem('recent_searches') || '[]');
    if (recentContainer) {
      recentContainer.innerHTML = searches.map(s => `<div class="recent-item" data-query="${escapeHtml(s)}">${escapeHtml(s)}</div>`).join('');
    }
  }
  
  // Add to recent searches
  function addRecentSearch(query) {
    if (!query.trim()) return;
    let searches = JSON.parse(localStorage.getItem('recent_searches') || '[]');
    searches = [query, ...searches.filter(s => s !== query)].slice(0, 10);
    localStorage.setItem('recent_searches', JSON.stringify(searches));
    loadRecentSearches();
  }
  
  // Clear recent searches
  clearRecentBtn?.addEventListener('click', () => {
    localStorage.removeItem('recent_searches');
    loadRecentSearches();
  });
  
  // Perform search
  async function performSearch() {
    const query = searchInput.value.trim();
    if (!query) return;
    
    currentQuery = query;
    currentPage = 1;
    addRecentSearch(query);
    
    loadingIndicator.style.display = 'block';
    resultsContainer.innerHTML = '';
    
    const category = document.getElementById('search-category').value;
    const minPrice = document.getElementById('min-price').value;
    const maxPrice = document.getElementById('max-price').value;
    const sortBy = document.getElementById('search-sort').value;
    const availability = document.getElementById('search-availability').value;
    
    const params = new URLSearchParams({
      q: query,
      page: currentPage,
      limit: 20,
      ...(category && { category }),
      ...(minPrice && { min_price: minPrice }),
      ...(maxPrice && { max_price: maxPrice }),
      ...(sortBy && { sort: sortBy }),
      ...(availability && { availability })
    });
    
    try {
      const response = await fetch(`/api/v1/books/search?${params}`);
      const data = await response.json();
      renderResults(data);
    } catch (error) {
      console.error('Search error:', error);
      resultsContainer.innerHTML = '<p class="error">Something went wrong. Please try again.</p>';
    } finally {
      loadingIndicator.style.display = 'none';
    }
  }
  
  function renderResults(data) {
    if (!data.books || data.books.length === 0) {
      resultsContainer.innerHTML = '<p>No books found. Try a different search term.</p>';
      return;
    }
    
    resultsContainer.innerHTML = data.books.map(book => `
      <div class="search-result-item">
        <img src="${book.cover_image_url || '/images/default-book-cover.jpg'}" alt="${escapeHtml(book.title)}" class="result-cover">
        <div class="result-info">
          <h4 class="result-title">${escapeHtml(book.title)}</h4>
          <p class="result-author">by ${escapeHtml(book.author_name)}</p>
          <p class="result-price">${book.is_free ? 'FREE' : `$${book.price}`}</p>
          <div class="result-actions">
            <a href="/book-preview.html?id=${book.id}" class="result-btn result-btn-secondary">Preview</a>
            ${book.is_free 
              ? `<button class="result-btn result-btn-primary" data-book-id="${book.id}" data-action="read">Read Now</button>`
              : `<button class="result-btn result-btn-primary" data-book-id="${book.id}" data-action="buy">Buy Now - $${book.price}</button>`
            }
          </div>
        </div>
      </div>
    `).join('');
    
    // Add pagination
    if (data.total_pages > 1) {
      const pagination = document.getElementById('search-pagination');
      pagination.style.display = 'flex';
      pagination.innerHTML = '';
      for (let i = 1; i <= Math.min(data.total_pages, 10); i++) {
        pagination.innerHTML += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      
      document.querySelectorAll('.pagination-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentPage = parseInt(e.target.dataset.page);
          performSearch();
        });
      });
    }
  }
  
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Open modal
  window.openSearchModal = function() {
    modal.style.display = 'block';
    searchInput.focus();
    loadRecentSearches();
  };
  
  // Close modal
  function closeModal() {
    modal.style.display = 'none';
  }
  
  overlay?.addEventListener('click', closeModal);
  closeBtn?.addEventListener('click', closeModal);
  searchBtn?.addEventListener('click', performSearch);
  searchInput?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') performSearch();
  });
  
  // Close on escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.style.display === 'block') {
      closeModal();
    }
  });
  
  // Recent item click
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('recent-item')) {
      const query = e.target.dataset.query;
      if (searchInput) searchInput.value = query;
      performSearch();
    }
  });
  
  // Action buttons (delegation)
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('result-btn-primary')) {
      const bookId = e.target.dataset.bookId;
      const action = e.target.dataset.action;
      if (action === 'read') {
        window.location.href = `/book-preview.html?id=${bookId}&mode=read`;
      } else if (action === 'buy') {
        window.location.href = `/checkout.html?book_id=${bookId}`;
      }
    }
  });
})();
</script>
